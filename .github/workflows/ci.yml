# Checks every push and pull request. Nothing here deploys or touches a live Firebase
# project: the rules tests run against the local emulator under "demo-duudle".
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Regression suite (must pass)
        run: npx --yes firebase-tools@15.30.0 emulators:exec --only firestore --project demo-duudle "npm test"
      # Audit findings F1/F2/F9/F11/F24: expected to fail until the Phase 1 lockdown.
      # Kept visible but non-blocking; Phase 1 makes it pass and merges it into the suite above.
      - name: Lockdown targets (expected to fail until Phase 1)
        continue-on-error: true
        run: npx --yes firebase-tools@15.30.0 emulators:exec --only firestore --project demo-duudle "npm run test:targets"

  functions:
    name: Cloud Functions syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check functions/index.js
