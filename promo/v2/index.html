<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Duudle promo v2</title>
<!--
  Duudle promo V2: one deterministic 46 s timeline (30 fps).
  window.renderFrame(n) lays out frame n; render.mjs screenshots each frame.
  Add #play to the URL for a real-time preview (no sound).

  What is real and what is illustration:
  - Duudle screens are only ever the screenshots in ../assets/screens and the screen-recording
    frames in ../assets/clips.
  - The pop-up (.ov) is rebuilt 1:1 from showRealDoodleOverlay() in MainActivity.kt (colours,
    260dp square canvas, title line, Snooze / Remove / Draw, the snooze choices), because the
    only screenshot of it is 320 px wide. The doodles inside are real ones from the app.
  - The photo feed and the music player are made-up "other apps" for context. They are not
    any real product.
-->
<style>
  @font-face { font-family: "Roboto"; src: url("../assets/fonts/Roboto-VF.ttf"); font-weight: 100 900; }
  :root { --ink:#141414; --cream:#F4F3F0; --yellow:#FFC800; --sun:#FFC933; --purple:#6750A4; }
  html, body { margin:0; background:#000; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:#0B0D1C;
           font-family:"Roboto", sans-serif; color:var(--ink); }
  #stage * { box-sizing:border-box; }
  .abs { position:absolute; left:0; top:0; }
  .full { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  .orb { position:absolute; border-radius:50%; filter:blur(110px); }
  .shape { position:absolute; left:0; top:0; width:220px; height:220px; margin:-110px 0 0 -110px; }
  .shape svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 14px 18px rgba(20,20,20,.12)); }
  #bgLav { background-color:#E6DBFB; background-image:radial-gradient(rgba(103,80,164,.20) 3px, transparent 3.6px); background-size:54px 54px; }

  /* phone mockup */
  #world { perspective:2600px; perspective-origin:540px 960px; }
  .phone { position:absolute; left:0; top:0; width:632px; height:1217px; margin:-608.5px 0 0 -316px;
           border-radius:74px; background:#101010;
           box-shadow: 0 0 0 2px #2b2b2b inset, 0 0 0 3px #000, 0 50px 90px rgba(20,20,20,.28), 0 18px 30px rgba(20,20,20,.18); }
  .phone .screen { position:absolute; left:16px; top:16px; width:600px; height:1185px; border-radius:58px; overflow:hidden; background:#fff; }
  .phone .screen > img { position:absolute; left:0; display:block; }
  .phone .screen > img.still { top:-40.65px; width:600px; height:1300.81px; }
  .phone .screen > img.clip { top:0; width:600px; height:1185px; }
  .phone .glare { position:absolute; inset:0; border-radius:58px; pointer-events:none;
                  background:linear-gradient(125deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 100%); }
  .tap { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
         border:7px solid var(--sun); background:rgba(255,201,51,.30); opacity:0; }
  .ring { position:absolute; border:7px solid var(--sun); border-radius:60px; opacity:0; box-shadow:0 0 0 5px rgba(20,20,20,.9), 0 10px 30px rgba(0,0,0,.25); }
  .swipe { position:absolute; width:92px; height:92px; margin:-46px 0 0 -46px; border-radius:50%; background:rgba(20,20,20,.22);
           border:4px solid rgba(255,255,255,.85); box-shadow:0 6px 18px rgba(0,0,0,.25); opacity:0; }
  #glow { position:absolute; left:0; top:0; width:1500px; height:2000px; margin:-1000px 0 0 -750px; pointer-events:none;
          background: radial-gradient(closest-side at 38% 58%, rgba(58,110,255,.60), transparent 70%),
                      radial-gradient(closest-side at 66% 36%, rgba(255,64,200,.42), transparent 68%); filter:blur(40px); }

  /* the real pop-up, rebuilt from showRealDoodleOverlay(): 1 dp = 600/360 px */
  .ov { position:absolute; left:65.5px; width:469px; background:#F5F0FB; padding:17.8px; transform-origin:50% 50%;
        box-shadow:0 26px 60px rgba(10,10,30,.34), 0 4px 12px rgba(10,10,30,.16); }
  .ov .ttl { font-size:26.7px; line-height:31.3px; color:#000; padding-bottom:8.9px; font-weight:400; }
  .ov .em { font-family:"Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .ov .cv { width:433.4px; height:433.4px; background:#fff; position:relative; overflow:hidden; }
  .ov .cv img { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; }
  .ov .rows { padding-top:8.9px; }
  .ov .row { display:flex; }
  .ov .btn { flex:0 0 146.7px; height:80px; padding:10px 6.67px; min-width:0; }
  .ov .btn.last, .ov .btn.eq { flex:1 1 0; }
  .ov .btn.wide { flex:1 1 100%; }
  .ov .pill { height:60px; border-radius:30px; background:#D9D7D8; display:flex; align-items:center; justify-content:center;
              font-weight:500; font-size:23.3px; letter-spacing:.03em; text-transform:uppercase; color:#1D1B20; white-space:nowrap;
              box-shadow:0 2px 4px rgba(0,0,0,.22); }
  .toast { position:absolute; left:50%; bottom:150px; transform:translateX(-50%); padding:18px 30px; border-radius:40px; background:rgba(50,50,54,.94);
           color:#fff; font-size:23px; white-space:nowrap; opacity:0; box-shadow:0 8px 20px rgba(0,0,0,.25); }
  #morph { position:absolute; background:#fff; opacity:0; overflow:hidden; }
  #morph img { position:absolute; left:0; top:0; width:100%; height:100%; }

  /* illustrative "other apps" */
  .app { position:absolute; inset:0; overflow:hidden; z-index:0; }
  .app .status { position:absolute; left:0; top:0; width:600px; height:54px; padding:20px 34px 0; display:flex; justify-content:space-between; font-weight:600; font-size:22px; z-index:3; }
  .app .status .ic { display:flex; gap:8px; align-items:center; }
  .feed { background:#fff; color:#17171a; }
  .feed .top { position:absolute; left:0; top:0; width:600px; height:128px; background:#fff; z-index:2; border-bottom:1px solid #ececec; }
  .feed .bar { position:absolute; left:0; top:58px; width:600px; height:68px; padding:0 30px; display:flex; align-items:center; justify-content:space-between; }
  .feed .brand { font-weight:800; font-size:38px; letter-spacing:-0.04em; }
  .feed .scroll { position:absolute; left:0; top:128px; width:600px; }
  .feed .stories { display:flex; gap:22px; padding:22px 26px 18px; border-bottom:1px solid #f0f0f0; }
  .feed .story { width:96px; text-align:center; font-size:17px; color:#55555c; }
  .feed .story i { display:block; width:96px; height:96px; border-radius:50%; border:5px solid; padding:5px; margin-bottom:8px; }
  .feed .story i b { display:block; width:100%; height:100%; border-radius:50%; }
  .feed .ph { height:84px; padding:0 24px; display:flex; align-items:center; gap:16px; font-weight:700; font-size:23px; }
  .feed .ph i { width:52px; height:52px; border-radius:50%; }
  .feed .ph s { margin-left:auto; text-decoration:none; letter-spacing:3px; color:#777; }
  .feed .pic { width:600px; height:600px; display:block; }
  .feed .acts { height:72px; padding:0 22px; display:flex; align-items:center; gap:22px; }
  .feed .acts svg:last-child { margin-left:auto; }
  .feed .meta { padding:0 24px 26px; font-size:21px; line-height:1.45; }
  .feed .meta b { font-weight:700; }
  .feed .meta u { display:block; text-decoration:none; height:14px; border-radius:7px; background:#e9e9ee; margin-top:12px; }
  .feed .nav { position:absolute; left:0; bottom:0; width:600px; height:92px; background:#fff; border-top:1px solid #ececec; display:flex; align-items:center; justify-content:space-around; padding:0 20px 8px; z-index:2; }
  .music { background:linear-gradient(180deg,#221a3a 0%, #15121f 55%, #0f0d17 100%); color:#fff; }
  .music .np { position:absolute; top:92px; width:600px; text-align:center; font-size:19px; letter-spacing:.22em; color:#b9b2d6; font-weight:600; }
  .music .tt { position:absolute; top:138px; width:600px; text-align:center; font-size:44px; font-weight:800; letter-spacing:-0.03em; }
  .music .ar { position:absolute; top:198px; width:600px; text-align:center; font-size:24px; color:#b9b2d6; }
  .music .art { position:absolute; left:70px; top:300px; width:460px; height:460px; border-radius:40px; overflow:hidden;
                background:conic-gradient(from 20deg at 50% 50%, #FF8A80, #FFC933, #9BE27A, #7FBDF7, #C4A4F5, #F895D2, #FF8A80); }
  .music .art::after { content:""; position:absolute; inset:150px; border-radius:50%; background:#15121f; box-shadow:0 0 0 30px rgba(255,255,255,.18); }
  .music .eq { position:absolute; left:0; top:800px; width:600px; height:70px; display:flex; gap:9px; justify-content:center; align-items:flex-end; }
  .music .eq i { width:12px; border-radius:6px; background:#C4A4F5; }
  .music .prog { position:absolute; left:50px; top:918px; width:500px; height:8px; border-radius:4px; background:rgba(255,255,255,.18); }
  .music .prog i { display:block; height:8px; border-radius:4px; background:#fff; position:relative; }
  .music .prog i::after { content:""; position:absolute; right:-9px; top:-6px; width:20px; height:20px; border-radius:50%; background:#fff; }
  .music .tm { position:absolute; left:50px; top:938px; width:500px; display:flex; justify-content:space-between; font-size:18px; color:#b9b2d6; }
  .music .ctl { position:absolute; left:0; top:985px; width:600px; display:flex; justify-content:center; align-items:center; gap:56px; }
  .music .play { width:112px; height:112px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }

  /* captions */
  .cap { position:absolute; left:0; width:1080px; text-align:center; font-weight:900; letter-spacing:-0.035em; line-height:1.04; }
  .cap .ln { display:block; }
  .cap.mask .ln { overflow:hidden; padding:0 20px 0.08em; }
  .cap .w { display:inline-block; white-space:pre; }
  .cap .w.hl { background-repeat:no-repeat; background-position:0 86%; padding:0 .08em; margin:0 -.08em; }

  /* flash cards + flying doodle card */
  .fc { position:absolute; left:0; top:0; width:600px; height:600px; margin:-300px 0 0 -300px; border-radius:72px; overflow:hidden; background:#fff;
        box-shadow:0 34px 70px rgba(40,20,90,.34), 0 0 0 3px rgba(20,20,20,.08); backface-visibility:hidden; }
  .fc img { width:100%; height:100%; object-fit:cover; display:block; }
  #fly { position:absolute; left:0; top:0; width:600px; height:600px; margin:-300px 0 0 -300px; background:#fff; overflow:hidden;
         box-shadow:0 40px 80px rgba(20,20,20,.30), 0 0 0 3px rgba(20,20,20,.06); }
  #fly img { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; }
  .cf { position:absolute; left:0; top:0; width:26px; height:26px; margin:-13px 0 0 -13px; }

  #wordmark { position:absolute; left:0; top:520px; width:1080px; text-align:center; font-weight:900; font-size:288px; letter-spacing:-0.05em; line-height:1; }
  #wordmark span { display:inline-block; }
  #cta { position:absolute; left:50%; top:1040px; height:104px; line-height:104px; padding:0 58px; border-radius:52px; background:var(--ink); color:#fff;
         font-weight:700; font-size:44px; letter-spacing:-0.01em; white-space:nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div id="bgDark" class="full">
    <div class="orb" style="left:-260px;top:900px;width:900px;height:900px;background:#1f3fd0;opacity:.55"></div>
    <div class="orb" style="left:520px;top:-200px;width:820px;height:820px;background:#c81fa8;opacity:.38"></div>
  </div>
  <div id="bgCream" class="full" style="background:var(--cream)"></div>
  <div id="bgYellow" class="full" style="background:var(--yellow)"></div>
  <div id="bgLav" class="full"></div>
  <div id="bgCream2" class="full" style="background:var(--cream)"></div>
  <div id="orbs" class="full">
    <div class="orb" id="orb0" style="width:760px;height:760px;background:#FBC9E8"></div>
    <div class="orb" id="orb1" style="width:820px;height:820px;background:#C6E3FF"></div>
    <div class="orb" id="orb2" style="width:700px;height:700px;background:#FFEDB3"></div>
  </div>
  <svg id="scribbles" class="full" viewBox="0 0 1080 1920"></svg>
  <svg id="ringBack" class="full" viewBox="0 0 1080 1920"></svg>
  <div id="decor" class="full"></div>
  <div id="world" class="full">
    <div id="glow"></div>
    <div id="phone2" class="phone"><div class="screen" id="screen2"></div></div>
    <div id="collage"></div>
    <div id="phone" class="phone"><div class="screen" id="screen"></div></div>
    <div id="cards"></div>
    <div id="fly"><img id="flyImg" src="../assets/doodle_yo_sam_canvas.png" alt=""></div>
  </div>
  <svg id="ringFront" class="full" viewBox="0 0 1080 1920"></svg>
  <div id="fx" class="full"></div>
  <div id="caps" class="full"></div>
  <div id="brand" class="full">
    <div id="wordmark"></div>
    <svg id="brandLine" class="abs" style="left:190px;top:800px" width="700" height="70" viewBox="0 0 700 70">
      <path id="brandLinePath" d="M12,40 C70,8 110,66 170,38 S270,10 330,38 S430,66 490,36 S610,12 688,34" fill="none" stroke="#FFC800" stroke-width="20" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    </svg>
    <div id="tagline" class="cap" style="top:900px;font-size:66px;font-weight:700;letter-spacing:-0.02em">Say it with a doodle.</div>
    <div id="cta">Coming soon on Android</div>
  </div>
</div>

<script>
'use strict';
const FPS = 30, DURATION = 46;
window.TOTAL_FRAMES = FPS * DURATION;
const $ = (id) => document.getElementById(id);
const K = 600 / 738;                       // screenshot px -> phone-screen px
const SH = 1185;

// ---------- easing / helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: (p) => p,
  out: (p) => 1 - Math.pow(1 - p, 3),
  out5: (p) => 1 - Math.pow(1 - p, 5),
  in: (p) => p * p * p,
  io: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  back: (p) => { const c = 1.55; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  spring: (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(11 * p)),
};
const prog = (t, t0, dur, ease = 'out') => E[ease](clamp((t - t0) / dur));
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, a] = keys[i - 1], [t1, b, ease] = keys[i];
      const p = E[ease || 'io'](clamp((t - t0) / Math.max(1e-6, t1 - t0)));
      return a.map((v, j) => lerp(v, b[j], p));
    }
  }
  return keys[keys.length - 1][1];
}
const show = (el, on) => { el.style.display = on ? '' : 'none'; };
const rnd = (i, salt = 0) => { const x = Math.sin(i * 127.1 + salt * 311.7) * 43758.5453; return x - Math.floor(x); };
const el = (tag, cls, html) => { const d = document.createElement(tag); if (cls) d.className = cls; if (html) d.innerHTML = html; return d; };
const circle = (node, x, y, r) => { node.style.clipPath = `circle(${Math.max(0, r)}px at ${x}px ${y}px)`; };
const setPhone = (node, [x, y, s, rx, ry, rz]) => {
  node.style.transform = `translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
};

// ---------- mascots (original shapes in the app's palette) ----------
const INK = '#141414';
const eye = (x, y) => `<circle cx="${x}" cy="${y}" r="21" fill="#fff"/><circle cx="${x - 4}" cy="${y + 3}" r="11" fill="${INK}"/>`;
const line = (d, w = 8) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const SHAPES = {
  green: `<circle cx="100" cy="100" r="96" fill="#9BE27A"/>${line('M50,86 q15,15 30,0')}${line('M120,86 q15,15 30,0')}${line('M78,122 q22,20 44,0')}`,
  pink: `<circle cx="100" cy="100" r="96" fill="#F895D2"/>${eye(66, 90)}${eye(134, 90)}${line('M86,134 q14,12 28,0')}`,
  bolt: `<polygon points="122,8 38,112 92,112 66,192 166,80 108,80" fill="#FFD25E" stroke="#FFD25E" stroke-width="18" stroke-linejoin="round"/>${line('M70,96 q10,-12 20,0', 7)}${line('M108,90 q10,-12 20,0', 7)}${line('M86,118 q14,14 28,0', 7)}`,
  orange: `<rect x="14" y="14" width="172" height="172" rx="42" fill="#FFA66B"/>${eye(68, 86)}${eye(134, 86)}${line('M86,134 q14,12 28,0')}`,
  coral: `<path d="M100,24 L182,172 L18,172 Z" fill="#FF8A80" stroke="#FF8A80" stroke-width="26" stroke-linejoin="round"/>${line('M62,112 l18,10 l-18,10', 7)}${line('M138,112 l-18,10 l18,10', 7)}${line('M88,152 q12,10 24,0', 7)}`,
  blue: `<path d="M100,8 C160,8 196,60 190,116 C184,170 140,194 96,192 C44,190 8,160 10,110 C12,54 44,8 100,8Z" fill="#7FBDF7"/>${line('M48,92 q15,15 30,0')}${line('M118,92 q15,15 30,0')}<ellipse cx="98" cy="134" rx="9" ry="12" fill="none" stroke="${INK}" stroke-width="8"/>`,
  lilac: `<circle cx="100" cy="100" r="96" fill="#E7D7FB"/><path d="M100,100 m-8,6 a14,14 0 1 1 22,-10 a36,36 0 1 1 -58,22 a60,60 0 1 1 104,26" fill="none" stroke="#C4A4F5" stroke-width="22" stroke-linecap="round"/><circle cx="78" cy="82" r="7" fill="${INK}"/><circle cx="126" cy="80" r="7" fill="${INK}"/><ellipse cx="104" cy="112" rx="6" ry="9" fill="none" stroke="${INK}" stroke-width="6"/>`,
};
// positions per phase: [x, y, scale, rot]
const POS = {
  //        pop (they jump out from behind the phone)   main (screen edges)        yellow scene              brand pile
  green:  { pop: [118, 560, 1.15, -10], main: [62, 560, 0.95, 6],     yel: [95, 620, 0.8, -10],  brand: [190, 330, 1.25, -8] },
  pink:   { pop: [962, 700, 1.0, 12],   main: [1022, 790, 0.85, -8],  yel: [1000, 560, 0.7, 12], brand: [120, 1400, 1.35, -10] },
  bolt:   { pop: [968, 1480, 1.2, 10],  main: [1005, 1500, 1.0, 10],  yel: null,                 brand: [530, 1520, 1.7, 6] },
  orange: { pop: [108, 1330, 1.05, -14], main: [70, 1390, 0.85, -14], yel: [80, 1480, 0.75, 10], brand: [945, 1360, 1.25, 10] },
  blue:   { pop: [860, 1800, 1.15, 6],  main: [925, 1815, 1.15, 8],   yel: [985, 1730, 0.9, -6], brand: [235, 1750, 1.75, -4] },
  coral:  { pop: [215, 1770, 1.0, -10], main: [150, 1800, 1.0, -8],   yel: [110, 1745, 0.8, 8],  brand: [860, 1740, 1.6, 8] },
  lilac:  { pop: [905, 360, 0.85, 10],  main: [985, 345, 0.72, 8],    yel: null,                 brand: [880, 300, 0.95, 10] },
};
const DECOR = {}, shapeEls = {};
Object.keys(SHAPES).forEach((name, i) => {
  const P = POS[name], d = i * 0.07, zero = (v) => [v[0], v[1], 0, v[3] - 30];
  const yel = P.yel || zero(P.main);
  const k = [
    [2.0 + d, [540, 1050, 0, P.pop[3] - 50]], [2.5 + d, P.pop, 'back'], [4.0, P.pop], [4.75, P.main],
  ];
  if (name === 'blue' || name === 'coral') {           // clear the lower third while captions sit there
    const off = name === 'blue' ? [1085, 1905, 0.85, 8] : [0, 1900, 0.85, -8];
    k.push([5.8, P.main], [6.4, off], [7.75, off], [8.35, P.main]);
  }
  k.push([17.45, P.main], [18.1, yel], [21.5, yel], [21.95, zero(yel)], [29.95 + d, zero(P.main)], [30.5 + d, P.main, 'back'],
         [39.4, P.main], [40.25 + d * 2, P.brand, 'back']);
  DECOR[name] = k;
  const s = el('div', 'shape', `<svg viewBox="0 0 200 200">${SHAPES[name]}</svg>`);
  $('decor').appendChild(s); shapeEls[name] = s;
});

// ---------- illustrative photo feed ("another app") ----------
const ICON = {
  heart: '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#17171a" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z"/></svg>',
  bubble: '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#17171a" stroke-width="2" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-11.7 7.1L4 20l1.3-4A8 8 0 1 1 20 11.5z"/></svg>',
  plane: '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#17171a" stroke-width="2" stroke-linejoin="round"><path d="M21 3 10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5 21 3z"/></svg>',
